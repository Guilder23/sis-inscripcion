{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/estudiantes.css' %}">
<div class="page">
    <div class="page-header">
        <div>
            <h1>{% if estudiante %}Editar estudiante{% else %}Nuevo estudiante{% endif %}</h1>
            <p>Complete los datos del estudiante y seleccione su facultad y carrera.</p>
        </div>
    </div>

    <div class="section-card">
        <form method="post" class="stacked-form">
            {% csrf_token %}
            <div class="form-grid">
                <label class="field">
                    <span>Código SIS</span>
                    <input type="text" name="codigo" value="{{ estudiante.codigo|default_if_none:'' }}" placeholder="Código SIS" required>
                </label>
                <label class="field">
                    <span>Usuario para acceso</span>
                    <input type="text" name="usuario" value="{{ estudiante.user.username|default_if_none:'' }}" placeholder="Usuario para acceso" required>
                </label>
                <label class="field">
                    <span>Contraseña</span>
                    <input type="password" name="password" placeholder="{% if estudiante %}Nueva contraseña (opcional){% else %}Contraseña{% endif %}" {% if not estudiante %}required{% endif %}>
                </label>
                <label class="field">
                    <span>Nombre</span>
                    <input type="text" name="nombre" value="{{ estudiante.nombre|default_if_none:'' }}" placeholder="Nombre" required>
                </label>
                <label class="field">
                    <span>Apellido</span>
                    <input type="text" name="apellido" value="{{ estudiante.apellido|default_if_none:'' }}" placeholder="Apellido" required>
                </label>
                <label class="field">
                    <span>Correo electrónico</span>
                    <input type="email" name="email" value="{{ estudiante.email|default_if_none:'' }}" placeholder="Correo" required>
                </label>
            </div>

            <div class="form-grid">
                <label class="field">
                    <span>Facultad</span>
                    <select name="facultad" id="facultadSelect" required>
                        <option value="">Seleccione una facultad</option>
                        {% for facultad in facultades %}
                        <option value="{{ facultad.pk }}" {% if estudiante and estudiante.facultad_id == facultad.pk %}selected{% endif %}>{{ facultad.nombre }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label class="field">
                    <span>Carrera</span>
                    <select name="carrera" id="carreraSelect" required>
                        <option value="">Seleccione una carrera</option>
                        {% for carrera in carreras %}
                        <option value="{{ carrera.pk }}" data-facultad="{{ carrera.facultad_id }}" {% if estudiante and estudiante.carrera_id == carrera.pk %}selected{% endif %}>{{ carrera.facultad.nombre }} - {{ carrera.nombre }}</option>
                        {% endfor %}
                    </select>
                </label>
            </div>

            <label class="checkbox-field">
                <input type="checkbox" name="activo" {% if estudiante and estudiante.activo %}checked{% endif %}>
                <span>Estudiante activo</span>
            </label>

            <button type="submit" class="btn">Guardar estudiante</button>
        </form>
    </div>
</div>
<script>
const facultadSelect = document.getElementById('facultadSelect');
const carreraSelect = document.getElementById('carreraSelect');
const carreraOptions = Array.from(carreraSelect.options).slice(1);

function filtrarCarreras() {
    const facultadId = facultadSelect.value;
    let hasVisible = false;
    carreraOptions.forEach((option) => {
        const matches = !facultadId || option.dataset.facultad === facultadId;
        option.hidden = !matches;
        option.disabled = !matches;
        if (matches) {
            hasVisible = true;
        }
    });
    if (!hasVisible) {
        carreraSelect.value = '';
    }
}

facultadSelect.addEventListener('change', filtrarCarreras);
filtrarCarreras();
</script>
{% endblock %}
