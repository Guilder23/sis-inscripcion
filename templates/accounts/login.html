{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
<div class="login-box">
    <h2>Iniciar sesión</h2>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="usuario" placeholder="Código SIS o usuario" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
