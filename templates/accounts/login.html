{% extends 'base.html' %}
{% load static %}
{% block auth_content %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
<div class="login-box">
    <h2><i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión</h2>
    <p class="hint">Sistema de inscripción estudiantil UMSS</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="text" name="usuario" placeholder="Código SIS o usuario" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar</button>
    </form>
    <p class="hint">Usuario administrador: admin / admin1234</p>
</div>
{% endblock %}
