{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <div class="page-header">
        <h1>Gestión de facultades</h1>
        <a href="{% url 'facultad_nuevo' %}" class="btn">Nueva facultad</a>
    </div>
    <table>
        <thead>
            <tr><th>Nombre</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            {% for facultad in facultades %}
            <tr>
                <td>{{ facultad.nombre }}</td>
                <td>
                    <a href="{% url 'facultad_editar' facultad.pk %}" class="btn small secondary">Editar</a>
                    <a href="{% url 'facultad_eliminar' facultad.pk %}" class="btn small danger" onclick="return confirm('¿Eliminar facultad?')">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="2">No hay facultades registradas.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
