{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <h1>Gestión de facultades</h1>
    <form method="post" class="inline-form">
        {% csrf_token %}
        <input type="text" name="nombre" placeholder="Nombre de la facultad" required>
        <button type="submit">Agregar</button>
    </form>
    <table>
        <thead>
            <tr><th>Nombre</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            {% for facultad in facultades %}
            <tr>
                <td>{{ facultad.nombre }}</td>
                <td>
                    <a href="{% url 'facultad_editar' facultad.pk %}">Editar</a>
                    <a href="{% url 'facultad_eliminar' facultad.pk %}" onclick="return confirm('¿Eliminar facultad?')">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="2">No hay facultades registradas.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
