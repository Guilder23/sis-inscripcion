{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <h1>Gestión de facultades</h1>
    <a class="btn" href="{% url 'dashboard' %}">Volver</a>
    <table>
        <thead>
            <tr><th>Nombre</th></tr>
        </thead>
        <tbody>
            {% for facultad in facultades %}
            <tr><td>{{ facultad.nombre }}</td></tr>
            {% empty %}
            <tr><td>No hay facultades registradas.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
