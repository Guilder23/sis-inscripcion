{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <div class="page-header">
        <h1>Gestión de carreras</h1>
        <a href="{% url 'carrera_nueva' %}" class="btn">Nueva carrera</a>
    </div>
    <table>
        <thead>
            <tr><th>Carrera</th><th>Facultad</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            {% for carrera in carreras %}
            <tr>
                <td>{{ carrera.nombre }}</td>
                <td>{{ carrera.facultad.nombre }}</td>
                <td>
                    <a href="{% url 'carrera_editar' carrera.pk %}" class="btn small secondary">Editar</a>
                    <a href="{% url 'carrera_eliminar' carrera.pk %}" class="btn small danger" onclick="return confirm('¿Eliminar carrera?')">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3">No hay carreras registradas.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
