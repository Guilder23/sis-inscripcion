{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <h1>{% if carrera %}Editar carrera{% else %}Nueva carrera{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="nombre" value="{{ carrera.nombre|default_if_none:'' }}" placeholder="Nombre de la carrera" required>
        <select name="facultad" required>
            <option value="">Seleccione facultad</option>
            {% for facultad in facultades %}
            <option value="{{ facultad.pk }}" {% if carrera and carrera.facultad_id == facultad.pk %}selected{% endif %}>{{ facultad.nombre }}</option>
            {% endfor %}
        </select>
        <button type="submit">Guardar</button>
    </form>
</div>
{% endblock %}
