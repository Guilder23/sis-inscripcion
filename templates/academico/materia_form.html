{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <div class="page-header">
        <div>
            <h1>{% if materia %}Editar materia{% else %}Nueva materia{% endif %}</h1>
        </div>
    </div>
    <div class="section-card">
        <form method="post" class="stacked-form">
            {% csrf_token %}
            <label class="field">
                <span>Código</span>
                <input type="text" name="codigo" value="{{ materia.codigo|default_if_none:'' }}" placeholder="Código" required>
            </label>
            <label class="field">
                <span>Nombre</span>
                <input type="text" name="nombre" value="{{ materia.nombre|default_if_none:'' }}" placeholder="Nombre" required>
            </label>
            <label class="field">
                <span>Créditos</span>
                <input type="number" name="creditos" value="{{ materia.creditos|default:4 }}" min="1" required>
            </label>
            <label class="field">
                <span>Semestre</span>
                <input type="number" name="semestre" value="{{ materia.semestre|default:1 }}" min="1" required>
            </label>
            <label class="field">
                <span>Carrera</span>
                <select name="carrera" required>
                    <option value="">Seleccione carrera</option>
                    {% for carrera in carreras %}
                    <option value="{{ carrera.pk }}" {% if materia and materia.carrera_id == carrera.pk %}selected{% endif %}>{{ carrera.facultad.nombre }} - {{ carrera.nombre }}</option>
                    {% endfor %}
                </select>
            </label>
            <div class="actions-row">
                <button type="submit" class="btn">Guardar</button>
                <a class="btn secondary" href="{% url 'materias' %}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
