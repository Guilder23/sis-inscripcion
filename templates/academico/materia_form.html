{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <h1>{% if materia %}Editar materia{% else %}Nueva materia{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="codigo" value="{{ materia.codigo|default_if_none:'' }}" required>
        <input type="text" name="nombre" value="{{ materia.nombre|default_if_none:'' }}" required>
        <input type="number" name="creditos" value="{{ materia.creditos|default:4 }}" min="1" required>
        <input type="number" name="semestre" value="{{ materia.semestre|default:1 }}" min="1" required>
        <select name="carrera" required>
            <option value="">Seleccione carrera</option>
            {% for carrera in carreras %}
            <option value="{{ carrera.pk }}" {% if materia and materia.carrera_id == carrera.pk %}selected{% endif %}>{{ carrera.facultad.nombre }} - {{ carrera.nombre }}</option>
            {% endfor %}
        </select>
        <button type="submit">Guardar</button>
    </form>
</div>
{% endblock %}
