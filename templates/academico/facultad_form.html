{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <h1>Editar facultad</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="nombre" value="{{ facultad.nombre }}" required>
        <button type="submit">Guardar</button>
    </form>
</div>
{% endblock %}
