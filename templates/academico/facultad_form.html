{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <div class="page-header">
        <div>
            <h1>{% if facultad %}Editar facultad{% else %}Nueva facultad{% endif %}</h1>
        </div>
    </div>
    <div class="section-card">
        <form method="post" class="stacked-form">
            {% csrf_token %}
            <label class="field">
                <span>Nombre de la facultad</span>
                <input type="text" name="nombre" value="{{ facultad.nombre|default_if_none:'' }}" placeholder="Nombre de la facultad" required>
            </label>
            <div class="actions-row">
                <button type="submit" class="btn">Guardar</button>
                <a class="btn secondary" href="{% url 'facultades' %}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
