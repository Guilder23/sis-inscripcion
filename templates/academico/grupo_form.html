{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <div class="page-header">
        <div>
            <h1>Editar grupo</h1>
        </div>
    </div>
    <div class="section-card">
        <form method="post" class="stacked-form">
            {% csrf_token %}
            <label class="field">
                <span>Materia</span>
                <select name="materia" required>
                    {% for materia in materias %}
                    <option value="{{ materia.pk }}" {% if grupo.materia_id == materia.pk %}selected{% endif %}>{{ materia.codigo }} - {{ materia.nombre }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="field">
                <span>Docente</span>
                <select name="docente">
                    <option value="">Sin docente</option>
                    {% for docente in docentes %}
                    <option value="{{ docente.pk }}" {% if grupo.docente_id == docente.pk %}selected{% endif %}>{{ docente.nombre }} {{ docente.apellido }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="field">
                <span>Horario</span>
                <input type="text" name="horario" value="{{ grupo.horario }}" placeholder="Horario">
            </label>
            <label class="field">
                <span>Número de grupo</span>
                <input type="number" name="numero" value="{{ grupo.numero }}" required>
            </label>
            <label class="field">
                <span>Cupo</span>
                <input type="number" name="cupo" value="{{ grupo.cupo }}" min="1" required>
            </label>
            <div class="actions-row">
                <button type="submit" class="btn">Guardar</button>
                <a class="btn secondary" href="{% url 'grupos' %}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
