{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/academico.css' %}">
<div class="page">
    <h1>Gestión de grupos</h1>
    <a class="btn" href="{% url 'dashboard' %}">Volver</a>
    <table>
        <thead>
            <tr><th>Materia</th><th>Grupo</th><th>Cupo</th></tr>
        </thead>
        <tbody>
            {% for grupo in grupos %}
            <tr><td>{{ grupo.materia.nombre }}</td><td>{{ grupo.numero }}</td><td>{{ grupo.cupo }}</td></tr>
            {% empty %}
            <tr><td colspan="3">No hay grupos registrados.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
