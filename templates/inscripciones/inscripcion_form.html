{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/inscripciones.css' %}">
<div class="page">
    <h1>Nueva inscripción</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <p><strong>Estudiante:</strong> {{ estudiante.nombre }} {{ estudiante.apellido }} ({{ estudiante.codigo }})</p>
        <select name="grupo" required>
            <option value="">Seleccione grupo</option>
            {% for grupo in grupos %}
            <option value="{{ grupo.pk }}">{{ grupo.materia.codigo }} - {{ grupo.materia.nombre }} | Grupo {{ grupo.numero }} | Docente: {{ grupo.docente }} | Horario: {{ grupo.horario }}</option>
            {% endfor %}
        </select>
        <button type="submit">Inscribir</button>
    </form>
</div>
{% endblock %}
