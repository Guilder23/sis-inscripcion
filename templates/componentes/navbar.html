{% load static %}
<header class="topbar">
    <div class="topbar-title with-logo">
        <a class="navbar-brand" href="{% url 'dashboard' %}">
            <img src="{% static 'img/image.png' %}" alt="UMSS logo" class="navbar-logo">
            <div>
                <h2>Sistema de Inscripción UMSS</h2>
                <p>Gestión académica moderna</p>
            </div>
        </a>
    </div>
    <div class="topbar-actions">
        {% if user.is_authenticated %}
            <span class="user-pill">{{ user.get_full_name|default:user.username }}</span>
            <a class="topbar-link" href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
        {% endif %}
    </div>
</header>
